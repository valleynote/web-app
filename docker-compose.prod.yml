services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valleynote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-valleynote}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valleynote} -d ${POSTGRES_DB:-valleynote}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://valleynote.com}
        NEXT_PUBLIC_WHOP_PLAN_BASIC_MONTHLY: ${NEXT_PUBLIC_WHOP_PLAN_BASIC_MONTHLY:-}
        NEXT_PUBLIC_WHOP_PLAN_BASIC_YEARLY: ${NEXT_PUBLIC_WHOP_PLAN_BASIC_YEARLY:-}
        NEXT_PUBLIC_WHOP_PLAN_PLUS_MONTHLY: ${NEXT_PUBLIC_WHOP_PLAN_PLUS_MONTHLY:-}
        NEXT_PUBLIC_WHOP_PLAN_PLUS_YEARLY: ${NEXT_PUBLIC_WHOP_PLAN_PLUS_YEARLY:-}
        NEXT_PUBLIC_WHOP_PLAN_PRO_MONTHLY: ${NEXT_PUBLIC_WHOP_PLAN_PRO_MONTHLY:-}
        NEXT_PUBLIC_WHOP_PLAN_PRO_YEARLY: ${NEXT_PUBLIC_WHOP_PLAN_PRO_YEARLY:-}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_OPTIONS: "--max-old-space-size=1536"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
